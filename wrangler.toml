name = "app"
main = "src/worker.js"
compatibility_date = "2025-09-01"
account_id = "d5539732756948f4182c5bdf0ed76d3c"
workers_dev = true

# Custom domain: switched on once pokesnipr.com's DNS is active on Cloudflare.
routes = [
  { pattern = "pokesnipr.com", custom_domain = true },
  { pattern = "www.pokesnipr.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true   # so www and workers.dev can redirect to pokesnipr.com

[[kv_namespaces]]
binding = "SHARES"
id = "4041df4e8ad242d1b3f7c8b7043c90a5"
